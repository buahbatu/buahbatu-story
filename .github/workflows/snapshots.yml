name: Snapshot visual Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Snapshot bagian ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Hanya spec yang punya snapshot visual
        run: npx playwright test $(grep -l toHaveScreenshot e2e/*.spec.ts) --update-snapshots=all --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Kumpulkan hanya snapshot yang berubah/baru
        if: always()
        run: |
          mkdir -p changed
          git ls-files -m -o --exclude-standard -- ':(glob)e2e/__screenshots__/**/*-linux.png' | while read -r f; do
            dest="changed/${f#e2e/__screenshots__/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
          echo "### 📸 Bagian ${{ matrix.shard }}: $(find changed -name '*.png' | wc -l) snapshot berubah/baru" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: snapshots-linux-${{ matrix.shard }}
          path: changed/
          if-no-files-found: ignore
          retention-days: 14
